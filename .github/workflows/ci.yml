name: CI

on:
  push:
    branches: [ develop ]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pinned reference SDK
      run: npm ci --ignore-scripts --no-fund --prefix tests/interop

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

    - name: Enforce critical coverage
      run: |
        python scripts/check-coverage.py --self-test
        python scripts/check-coverage.py "TestResults/**/coverage.cobertura.xml"

    - name: Run documented example
      run: dotnet run --project examples/Andy.MCP.Examples --configuration Release --no-build -- inprocess

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}
        path: ./TestResults/**/coverage.cobertura.xml
        if-no-files-found: error

  interop:
    # Independent official-SDK client and server: stdio, HTTP JSON/SSE and nested sampling.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install pinned reference SDK
      run: npm ci --ignore-scripts --no-fund --prefix tests/interop

    - name: Build
      run: dotnet build --configuration Release -p:RestoreLockedMode=true

    - name: Interop tests
      run: dotnet test --configuration Release --no-build --framework net10.0 --filter "Category=Interop"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Fail on vulnerable dependencies
      shell: bash
      run: |
        output=$(dotnet list package --vulnerable --include-transitive 2>&1)
        echo "$output"
        if echo "$output" | grep -q "has the following vulnerable packages"; then
          echo "::error::Vulnerable dependencies detected"
          exit 1
        fi

    - name: Report outdated packages
      shell: bash
      run: dotnet list package --outdated || true
